<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/osmtogeojson@3.0.0-beta.5/osmtogeojson.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; }
        #status {
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,255,255,0.88);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-family: sans-serif;
            color: #444;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div id="status">Učitavanje regiona…</div>
<script>
    var map = L.map('map', { zoomControl: true }).setView([44.2, 20.9], 7);

    // Custom pane above the overlay pane (400) and marker pane (600)
    map.createPane('emojiPane');
    map.getPane('emojiPane').style.zIndex = 650;
    map.getPane('emojiPane').style.pointerEvents = 'none';

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>',
        maxZoom: 18
    }).addTo(map);

    // Confirmed OSM relation IDs for Serbia's 5 NUTS2 statistical regions
    var ID_TO_REGION = {
        '1279074': { key: 'Vojvodina',                 display: 'Vojvodina',                    icon: '🌷', color: '#E74C3C' },
        '1677007': { key: 'Beograd',                   display: 'Beograd',                      icon: '🏙', color: '#2980B9' },
        '2959530': { key: 'Sumadija i Zapadna Srbija', display: 'Šumadija i Zapadna Srbija',    icon: '🌲', color: '#27AE60' },
        '2959529': { key: 'Juzna i Istocna Srbija',    display: 'Južna i Istočna Srbija',       icon: '🍵', color: '#8E44AD' },
        '2088990': { key: 'Kosovo i Metohija',          display: 'Kosovo i Metohija',             icon: '🏔', color: '#E67E22' }
    };

    var regionData        = {};
    var currentUserRegion = null;

    var query = '[out:json][timeout:30];relation(id:2959530,2959529,1279074,1677007,2088990);out geom;';

    fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(query)
    })
    .then(function(r) { return r.json(); })
    .then(function(osm) {
        var geojson = osmtogeojson(osm);

        L.geoJSON(geojson, {
            // Only render polygons — osmtogeojson also produces Point/LineString
            // features from OSM nodes/ways which would show as unwanted blue pins
            filter: function(feature) {
                var t = feature.geometry && feature.geometry.type;
                return t === 'Polygon' || t === 'MultiPolygon';
            },
            style: function(feature) {
                var osmId  = (feature.id || '').replace('relation/', '');
                var region = ID_TO_REGION[osmId];
                var color  = region ? region.color : '#999';
                var isUser = region && region.key === currentUserRegion;
                return {
                    color:       '#fff',
                    weight:      isUser ? 3 : 1.5,
                    fillColor:   color,
                    fillOpacity: isUser ? 0.65 : 0.45
                };
            },
            onEachFeature: function(feature, layer) {
                var osmId  = (feature.id || '').replace('relation/', '');
                var region = ID_TO_REGION[osmId];
                if (!region) return;
                var bounds = layer.getBounds();
                if (!bounds.isValid()) return;
                L.marker(bounds.getCenter(), {
                    icon: L.divIcon({
                        className: '',
                        html: '<div style="font-size:22px;text-align:center;">'
                            + region.icon + '</div>',
                        iconSize:   [30, 30],
                        iconAnchor: [15, 15]
                    }),
                    pane:        'emojiPane',
                    interactive: false
                }).addTo(map);
            }
        }).addTo(map);

        document.getElementById('status').style.display = 'none';
    })
    .catch(function(err) {
        document.getElementById('status').textContent = 'Greška: ' + err.message;
    });

    // Called from Android
    function setRegionData(jsonStr) {
        try { regionData = JSON.parse(jsonStr); } catch(e) {}
    }

    function setCurrentUserRegion(key) {
        currentUserRegion = key;
    }
</script>
</body>
</html>
